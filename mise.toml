[settings]
# Enforce installs from the committed mise.lock (no silent re-resolution to new
# versions). Run `mise lock` after changing tools to update it.
locked = true

[tools]
"cargo:cargo-audit" = "0.22.2"
"cargo:cargo-bundle-licenses" = "4.2.0"
"cargo:cargo-crap" = "0.5.0"
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-llvm-cov" = "0.9.1"
cocogitto = "7.0.0"
hk = "1.57.0"
# mr-boxington (`mbx`) wraps cargo with a content-addressed compiler cache. mise
# installs it, and the Rust tool's `mr_boxington` option below turns it on for
# every `mise run` task, so CI restores compiler actions instead of rebuilding
# from scratch — see .github/workflows/ci.yml. The option needs mise 2026.9.2 or
# newer; `jdx/mise-action` installs a current mise.
mr-boxington = "1.21.0"
# The documentation check (`mise run docs-mermaid`) parses the Mermaid diagrams
# with the same parser a renderer uses, which is a Node tool.
node = "24.19.0"
rust = { version = "1.98.1", mr_boxington = true }


# `cargo check` builds the workspace, and in a workspace the server's
# `features = ["nats", "oidc"]` unify features into the shell, so the shell is never
# compiled in its own default configuration. That is how `gateway::precompute`'s
# missing entropy feature stayed invisible while `cargo check -p loomery-shell`
# failed; the per-package check below is the one that sees it. `--no-default-features`
# does not help, because the masking feature is requested explicitly, not by default.
[tasks.verify]
description = "Verifies integrity of the repository and its dependencies"
run = """
cargo check
cargo check -p loomery-shell
cargo clippy --workspace --all-targets -- -D warnings
cargo fmt --check
cargo deny check
"""

[tasks.test]
description = "Runs the full test suite"
run = "cargo test --workspace"

[tasks.audit]
description = "Checks dependencies for security advisories"
run = "cargo audit"

[tasks.licenses]
description = "Regenerates the bundled third-party license texts"
run = """
RUST_LOG=error cargo bundle-licenses --format yaml --output THIRDPARTY.yml --features test-services --prefer Apache-2.0,MIT --previous THIRDPARTY.yml
"""

[tasks.licenses-check]
description = "Fails if the bundled third-party license texts are stale"
run = """
tmp="$(mktemp)"
RUST_LOG=error cargo bundle-licenses --format yaml --output "$tmp" --features test-services --prefer Apache-2.0,MIT --previous THIRDPARTY.yml
diff -u THIRDPARTY.yml "$tmp"
rm -f "$tmp"
"""

[tasks.coverage]
description = "Generates a coverage report (llvm-cov, floor 80%)"
run = "cargo llvm-cov --workspace --lcov --output-path lcov.info"

[tasks.crap]
description = "Computes CRAP scores from coverage (fails above threshold)"
run = """
cargo llvm-cov --workspace --lcov --output-path lcov.info
cargo crap --workspace --lcov lcov.info --fail-above --exclude '**/*_tests.rs' --exclude '**/main.rs' --exclude '**/outbox/nats.rs' --exclude '**/build.rs'
"""

[tasks.docs-mermaid]
description = "Parses every Mermaid diagram in the docs and workpad (a broken diagram fails)"
run = "sh tools/mermaid-check/check.sh docs README.md workpad"

[tasks.docs-links]
description = "Checks links, anchors, citations and site reachability (staging links warn, site links fail)"
run = "python3 tools/docs-links/check.py docs README.md workpad"

[tasks.docs-site]
description = "Builds the published VitePress site in docs/ (installs its dependencies first when they are missing)"
run = """
if [ ! -d docs/node_modules ]; then
    npm ci --prefix docs --no-audit --no-fund
fi
npm --prefix docs run build
"""

[tasks.docs-site-publish]
description = "Builds the site and publishes it to the gh-pages branch, which a static host can deploy from"
run = "sh scripts/publish-docs-site.sh"

[tasks.docs-mermaid-render]
description = "Renders the docs' Mermaid diagrams to tools/mermaid-check/out for review"
run = "sh tools/mermaid-check/check.sh --render docs"

# The soak is a *performance* probe, so it runs a release build: an unoptimised
# test build measures the compiler, not the storage (it is ~5x slower per command,
# which reads as a bottleneck that is not there).
[tasks.soak]
description = "Soaks the persistence path with 2,000 commands in both modes (release)"
run = "LOOMERY_TEST_SOAK=1 LOOMERY_TEST_SOAK_COMMANDS=2000 cargo test --release -p loomery-shell --lib a_long_history_soak -- --nocapture"

[tasks.soak-checkpoint]
description = "Soaks checkpoint-mode persistence with 8,000 commands (release)"
run = "LOOMERY_TEST_SOAK=1 LOOMERY_TEST_SOAK_MODE=checkpoint LOOMERY_TEST_SOAK_COMMANDS=8000 cargo test --release -p loomery-shell --lib a_long_history_soak -- --nocapture"

[tasks.soak-snapshot]
description = "Soaks snapshot-mode persistence with 10,000 commands (release)"
run = "LOOMERY_TEST_SOAK=1 LOOMERY_TEST_SOAK_MODE=snapshot LOOMERY_TEST_SOAK_COMMANDS=10000 cargo test --release -p loomery-shell --lib a_long_history_soak -- --nocapture"

[tasks.bench-consensus]
description = "Runs the controlled multi-process tonic/RocksDB benchmark in release mode"
run = "cargo run --release -p loomery-shell --example consensus_bench -- --config workpad/benchmarks/consensus.json"

[tasks.bench-deployment-scale]
description = "Measures the deployment path: 3 nodes at 2k/5k/10k/20k events, checkpoint and snapshot"
run = "python3 scripts/bench-deployment-scale.py"

[tasks.bench-collect]
description = "Collects the deployment-path runs into workpad/benchmarks/results/deployment-path.json"
run = "python3 scripts/bench-collect-results.py --print"

[tasks.bench-persistence]
description = "Compares checkpoint and snapshot recovery with controlled crash benchmarks"
run = "python3 scripts/bench-persistence.py"

[tasks.bench-batching]
description = "Compares bounded command batching against the durable single-command baseline"
run = "python3 scripts/bench-batching.py"

[tasks.bench-batch-matrix]
description = "Sweeps command batch sizes and concurrency with randomized durable Raft trials"
run = "python3 scripts/bench-batch-matrix.py"

[tasks.bench-services-stress]
description = "Stress-tests the Keycloak and NATS adapters (auth, outbox, end-to-end)"
run = "python3 scripts/bench-services-stress.py"

[tasks.test-consensus-failures]
description = "Injects replica crashes, quorum loss and lost replies during durable writes"
run = "python3 scripts/test-consensus-failures.py"

[tasks.server]
description = "Runs the runtime host (loomery-server) with --config <path>"
run = "cargo run -p loomery-server --"

[tasks.svc-up]
description = "Starts the Keycloak and NATS JetStream test services"
run = """
docker compose -f compose.test.yaml up -d
bash scripts/test-services/wait-for-services.sh
"""

[tasks.svc-down]
description = "Stops the test services and removes their state"
run = "docker compose -f compose.test.yaml down -v"

[tasks.verify-services]
description = "Lints the test-services adapters (Keycloak, NATS)"
run = "cargo clippy -p loomery-shell --all-targets --features test-services -- -D warnings"

[tasks.test-services]
description = "Runs the Keycloak/NATS integration tests against local services"
run = """
docker compose -f compose.test.yaml up -d
bash scripts/test-services/wait-for-services.sh
cargo clippy -p loomery-shell --all-targets --features test-services -- -D warnings
export LOOMERY_TEST_NATS_URL="${LOOMERY_TEST_NATS_URL:-nats://127.0.0.1:4222}"
export LOOMERY_TEST_KEYCLOAK_URL="${LOOMERY_TEST_KEYCLOAK_URL:-http://127.0.0.1:8080}"
cargo test -p loomery-shell --features test-services --test test_services
"""
