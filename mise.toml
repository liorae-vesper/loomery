[settings]
# Enforce installs from the committed mise.lock (no silent re-resolution to new
# versions). Run `mise lock` after changing tools to update it.
locked = true

[tools]
"cargo:cargo-audit" = "0.22.2"
"cargo:cargo-crap" = "0.5.0"
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-llvm-cov" = "0.9.1"
cocogitto = "7.0.0"
hk = "1.57.0"
rust = "1.98.1"


[tasks.verify]
description = "Verifies integrity of the repository and its dependencies"
run = """
cargo check
cargo clippy --workspace --all-targets -- -D warnings
cargo fmt --check
cargo deny check
"""

[tasks.test]
description = "Runs the full test suite"
run = "cargo test --workspace"

[tasks.audit]
description = "Checks dependencies for security advisories"
run = "cargo audit"

[tasks.coverage]
description = "Generates a coverage report (llvm-cov, floor 80%)"
run = "cargo llvm-cov --workspace --lcov --output-path lcov.info"

[tasks.crap]
description = "Computes CRAP scores from coverage (fails above threshold)"
run = """
cargo llvm-cov --workspace --lcov --output-path lcov.info
cargo crap --workspace --lcov lcov.info --fail-above --exclude '**/*_tests.rs'
"""

[tasks.bench-consensus]
description = "Runs the controlled multi-process tonic/RocksDB benchmark in release mode"
run = "cargo run --release -p loomery-shell --example consensus_bench -- --config docs/benchmarks/consensus.json"

[tasks.bench-persistence]
description = "Compares checkpoint and snapshot recovery with controlled crash benchmarks"
run = "python3 scripts/bench-persistence.py"

[tasks.bench-batching]
description = "Compares bounded command batching against the durable single-command baseline"
run = "python3 scripts/bench-batching.py"

[tasks.bench-batch-matrix]
description = "Sweeps command batch sizes and concurrency with randomized durable Raft trials"
run = "python3 scripts/bench-batch-matrix.py"

[tasks.test-consensus-failures]
description = "Injects replica crashes, quorum loss and lost replies during durable writes"
run = "python3 scripts/test-consensus-failures.py"

[tasks.svc-up]
description = "Starts the Keycloak and NATS JetStream test services"
run = """
docker compose -f compose.test.yaml up -d
bash scripts/test-services/wait-for-services.sh
"""

[tasks.svc-down]
description = "Stops the test services and removes their state"
run = "docker compose -f compose.test.yaml down -v"

[tasks.verify-services]
description = "Lints the test-services adapters (Keycloak, NATS)"
run = "cargo clippy -p loomery-shell --all-targets --features test-services -- -D warnings"

[tasks.test-services]
description = "Runs the Keycloak/NATS integration tests against local services"
run = """
docker compose -f compose.test.yaml up -d
bash scripts/test-services/wait-for-services.sh
cargo clippy -p loomery-shell --all-targets --features test-services -- -D warnings
export LOOMERY_TEST_NATS_URL="${LOOMERY_TEST_NATS_URL:-nats://127.0.0.1:4222}"
export LOOMERY_TEST_KEYCLOAK_URL="${LOOMERY_TEST_KEYCLOAK_URL:-http://127.0.0.1:8080}"
cargo test -p loomery-shell --features test-services --test test_services
"""
