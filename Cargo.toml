[workspace]
resolver = "2"
members = [
  "crates/*",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
publish = false

[workspace.dependencies]
loomery-core = { path = "crates/core"}
loomery-genesis = {path = "crates/genesis"}

[workspace.lints.clippy]
# Standard groups
pedantic = { level = "warn", priority = -1 }
perf = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "warn", priority = -1 }

# Explicit restriction lints (instead of blanket restriction = "deny")
panic = "deny"
panic_in_result_fn = "deny"
panicking_unwrap = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
unchecked_time_subtraction = "deny"

# Additional high-value restrictions
arithmetic_side_effects = "deny" # Replaces indexing/overflow risks in math operations
string_slice = "deny"            # Blocks str[start..end] panics

[workspace.lints.rust]
unconditional_panic = "deny"
missing_docs = "warn"