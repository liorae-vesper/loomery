[graph]
targets = []
all-features = true

# cargo-deny 0.20+ schema:
# - `vulnerability` and `notice` advisory severities were removed; vulnerability and
#   unsound advisories now ALWAYS fail the check (see https://embarkstudios.github.io/cargo-deny/checks/advisories/cfg.html)
# - `unmaintained`/`unsound` are now scopes: all | workspace | transitive | none
[advisories]
unmaintained = "all"  # Fail on any unmaintained crate (direct or transitive)
unsound = "all"       # Fail on any unsound crate (direct or transitive)
yanked = "deny"       # Deny yanked crate versions (common attack vector)

[licenses]
# cargo-deny 0.20+ denies EVERY license unless explicitly allowed below;
# the old severity keys (unlicensed/copyleft/allow-osi-fsf-free/default) were removed.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8      # High threshold to verify license headers
# The allowlist is deliberately broader than today's dependency tree, so an unused
# entry is expected rather than a finding (`allow` keeps it out of the report).
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"      # Flag duplicate versions of the same dependency
wildcards = "deny"              # Block wildcard version specifiers (e.g., "*")
# Workspace-internal crates are depended on as version-less path deps on purpose
# (`trellis-core = { workspace = true }`); a path dep is not a registry wildcard,
# so allow it while still rejecting real `*` requirements.
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

deny = [
    { name = "openssl", reason = "Prefer pure Rust implementations like rustls." },
    { name = "md-5", reason = "Cryptographically broken hash function." },
    { name = "sha1", reason = "Cryptographically weak hash function." },
]

# Known, accepted duplicate: `syn` 2 is pulled in only for Windows targets
# (`windows-implement`/`windows-interface` via chrono's `iana-time-zone`), while
# everything else is on `syn` 3. Nothing in this workspace ships for Windows today,
# so the second copy is not actionable.
skip = [
    { name = "syn", version = "=2.0.119" },
]

[sources]
unknown-registry = "deny"  # Block dependencies from untrusted registries
unknown-git = "deny"       # Block random git dependencies missing explicit approval
allow-git = []             # List specific git repos here if strictly required
allow-registry = [
    "https://github.com/rust-lang/crates.io-index" # Lock down to official crates.io
]

