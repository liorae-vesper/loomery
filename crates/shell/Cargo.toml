[package]
name = "loomery-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Imperative shell: consesus, storage, gateway and workers"

[dependencies]
loomery-core.workspace = true
loomery-genesis.workspace = true
anyhow = "1.0.104"
# `std` is what turns on `password-hash/std` -> `rand_core/std` -> `getrandom`, and
# therefore `OsRng` for salt generation. Without it the default build of this crate
# only compiles because a workspace build unifies `rand_core` features in through
# `jsonwebtoken` (server enables `oidc`); see gateway::precompute.
argon2 = { version = "0.5", features = ["std"] }
axum = "0.8"
dashmap = "6.2.1"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt", "macros", "time", "sync", "net", "rt-multi-thread", "fs"] }
openraft = { version = "0.10.0-alpha.36", features = ["serde", "compat"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

tonic = { version = "0.14", features = ["tls-ring"] }
tonic-prost = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
prost = "0.14"
rocksdb = { version = "0.24", default-features = false, features = ["bindgen-runtime", "lz4"] }
tokio-stream = { version = "0.1", features = ["net"] }
async-nats = { version = "0.50.0", optional = true, default-features = false, features = ["jetstream", "nkeys"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls-no-provider"], optional = true }
# JWT/JWKS validation for the runtime OIDC adapter. The crypto backend is a
# feature in 10+: `rust_crypto` is pure Rust under MIT/Apache, while `aws_lc_rs`
# would pull the non-OSI `OpenSSL` license and a cmake/C build (see deny.toml).
jsonwebtoken = { version = "11.1", optional = true, default-features = false, features = ["rust_crypto"] }

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["process", "io-util", "io-std"] }
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
rcgen = "0.14"
# The offline OIDC tests generate their own key pair and publish a JWKS, so the
# adapter is exercised against a real signature without a live provider. All
# three crates are already in the tree (jsonwebtoken's `rust_crypto` backend).
rsa = "0.9"
rand = "0.8"
base64 = "0.22"

[lints]
workspace = true

[features]
# The default build and the default suite stay self-contained: neither of the
# optional runtimes below is compiled without an explicit feature.
default = []
# The NATS JetStream runtime: outbox publisher, saga consumer and its worker.
nats = ["dep:async-nats"]
# Provider-agnostic OIDC: discovery, JWKS and local JWT validation.
oidc = ["dep:reqwest", "dep:jsonwebtoken"]
# The compose-backed integration suite (Keycloak + NATS) and the stress harness.
test-services = ["nats", "oidc"]
