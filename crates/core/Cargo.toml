[package]
name = "loomery-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Pure, deterministic core of the Loomery event-sourced backend"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
dashmap = "6.2.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
uuid = { version = "1.26.1", features = ["v5", "v7"] }

[dev-dependencies]
proptest = "1.11.0"
