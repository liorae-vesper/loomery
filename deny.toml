[graph]
targets = []
all-features = true

# cargo-deny 0.20+ schema:
# - `vulnerability` and `notice` advisory severities were removed; vulnerability and
#   unsound advisories now ALWAYS fail the check (see https://embarkstudios.github.io/cargo-deny/checks/advisories/cfg.html)
# - `unmaintained`/`unsound` are now scopes: all | workspace | transitive | none
[advisories]
unmaintained = "all"  # Fail on any unmaintained crate (direct or transitive)
unsound = "all"       # Fail on any unsound crate (direct or transitive)
yanked = "deny"       # Deny yanked crate versions (common attack vector)

# RUSTSEC-2023-0071 ("Marvin") is a *private-key* timing side channel in the
# `rsa` crate: "information about the private key is leaked through timing
# information", and its own workaround section says to avoid the crate "in
# settings where attackers can observe timing". Loomery never holds an RSA
# private key in this process: the gateway only *verifies* RS*/PS* signatures
# against public keys fetched from the identity provider's JWKS, which is what
# jsonwebtoken's pure-Rust `rust_crypto` backend does (crates/shell/Cargo.toml).
# The other backend would import the non-OSI `OpenSSL` license and a cmake/C
# build. Revisit if anything here ever signs or decrypts with RSA.
ignore = ["RUSTSEC-2023-0071"]

[licenses]
# cargo-deny 0.20+ denies EVERY license unless explicitly allowed below;
# the old severity keys (unlicensed/copyleft/allow-osi-fsf-free/default) were removed.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    # Root-certificate *data* (`webpki-root-certs`, a wasm32-only dependency of
    # reqwest's rustls platform verifier). cargo-deny resolves every target, even
    # though Loomery never builds for wasm32, so the license has to be allowed.
    # CDLA-Permissive-2.0 is a permissive data license: use, modify and share,
    # with the sole condition that the agreement text accompanies the
    # redistributed data (§2.1) — satisfied by the committed THIRDPARTY.yml
    # bundle (`mise run licenses`, see docs/third-party-licenses.md). It is not
    # OSI-approved (it is a data license), but Fedora's license data accepted it
    # in 2025-05.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8      # High threshold to verify license headers
# The allowlist is deliberately broader than today's dependency tree, so an unused
# entry is expected rather than a finding (`allow` keeps it out of the report).
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"      # Flag duplicate versions of the same dependency
wildcards = "deny"              # Block wildcard version specifiers (e.g., "*")
# Workspace-internal crates are depended on as version-less path deps on purpose
# (`loomery-core = { workspace = true }`); a path dep is not a registry wildcard,
# so allow it while still rejecting real `*` requirements.
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

deny = [
    { name = "openssl", reason = "Prefer pure Rust implementations like rustls." },
    { name = "md-5", reason = "Cryptographically broken hash function." },
    { name = "sha1", reason = "Cryptographically weak hash function." },
]

# Known, accepted duplicate: `syn` 2 and `syn` 3 are semver-incompatible (`^2` vs
# `^3`) and both are genuinely required. Most of the tree has moved to `syn` 3, but
# `syn` 2 is still pinned by eleven build and proc-macro crates that have not
# followed: `bindgen` 0.72 (build-dep of `librocksdb-sys`), the prost/tonic 0.14
# build stack (`prost-build`, `prost-derive`, `tonic-build`, `tonic-prost-build`,
# `prettyplease`), `derive_more-impl` (via `openraft` 0.10's `derive_more`),
# `pin-project-internal`, `tracing-attributes`, `curve25519-dalek-derive` and
# `zeroize_derive`. None of these is a Windows-only copy — they are all on the host
# target — and neither copy can be removed without an upstream major bump, so the
# duplicate is recorded as accepted; `multiple-versions = "warn"` still reports any
# *new* duplicate version.

[sources]
unknown-registry = "deny"  # Block dependencies from untrusted registries
unknown-git = "deny"       # Block random git dependencies missing explicit approval
allow-git = []             # List specific git repos here if strictly required
allow-registry = [
    "https://github.com/rust-lang/crates.io-index" # Lock down to official crates.io
]

