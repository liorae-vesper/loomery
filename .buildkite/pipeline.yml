# Loomery CI — Buildkite.
#
# Converted from .github/workflows/ci.yml with the `bk` CLI:
#
#   bk pipeline convert --file .github/workflows/ci.yml --vendor github
#
# and then finished by hand, because two things the converter cannot know:
#
#   1. Every job used to call `bash scripts/install-host-deps.sh` to apt-install
#      protoc and libclang. Those, the pinned Rust toolchain and the cargo tools
#      now come from .buildkite/Dockerfile, so each step runs in that image and
#      no step installs anything.
#   2. The `test services` job drives a compose stack through the host Docker
#      daemon, so that one step needs the socket, host networking and the
#      checkout mounted at its host path (see the step's comments).
# Hosted cache volumes persist dependencies between successful jobs, but they are
# attached best-effort and committed only for a step that succeeds, so what a job
# finds in one varies between builds: the verify step was fully warm at 50s in
# builds #21–#23 and cold again at 373s and 407s in #24 and #25 on the same
# pipeline. The five-minute RocksDB C++ compile that dominated those runs is
# therefore built into the image instead (see .buildkite/Dockerfile), and what is
# left here is a cargo target directory plus mr-boxington's store for everything
# else. Rust steps still have separate named volumes so parallel writers and
# coverage's compiler flags do not evict each other's artifacts. Cargo validates
# cached artifacts against the toolchain, flags and dependency versions; lockfile
# changes do not discard all unchanged dependencies. Bind mounts expose the host
# caches inside the Docker containers, at stable paths independent of each
# agent's checkout.
#
# This file only runs if a step uploads it. The steps stored in the Buildkite
# dashboard *are* the pipeline, and whichever you write there replaces this file
# entirely — they are not a fallback for it. In the YAML steps editor they need
# to be the upload step Buildkite gives a pipeline created against this
# repository:
#
#   steps:
#     - label: "\:pipeline\: Pipeline upload"
#       command: buildkite-agent pipeline upload
#
# Dashboard steps interpolate only a subset of variables (`BUILDKITE_BRANCH`,
# `BUILDKITE_COMMIT` and friends), so a `$VAR` written there can expand to
# nothing — where the same `$VAR` inside this file is expanded from the job
# environment when the file is uploaded.
#
# Also configure in the Buildkite UI:
#
#   * GitHub integration: build pull requests, and pushes to `main` only
#     (the old workflow's `branches: [main]`).
#   * Builds → "Cancel Intermediate Builds": the old `cancel-in-progress`.
#
# These steps use Linux hosted agents with Docker and native cache volumes.
# Add `agents: { queue: linux-small }` if the cluster routes on multiple queues.
#
# Hosted agents have separate Docker daemons. `depends_on` orders the jobs but
# does not share local images, so `build-ci-image` uploads a compressed Docker
# image archive. Every consumer downloads it before the Docker command hook
# loads it. Artifacts are scoped to this build; the image tag also includes the
# build ID to keep concurrent builds on self-hosted daemons from colliding.

env:
  LOOMERY_CI_IMAGE: "loomery-ci:${BUILDKITE_BUILD_ID}"

steps:
  - label: ":docker: Build CI image"
    key: "build-ci-image"
    command: "sh .buildkite/scripts/build-ci-image.sh"
    cache:
      name: "ci-image-v1"
      paths:
        - "/cache/loomery-buildkit"
      size: "40g"
    artifact_paths: "loomery-ci.tar.gz"
    plugins:
      - docker#v5.14.0:
          image: "docker:28-cli"
          always-pull: true
          # Load onto this daemon so `docker save` can export the image.
          chown: true
          environment:
            - "LOOMERY_CI_IMAGE"
          volumes:
            - "/var/run/docker.sock:/var/run/docker.sock"
            - "/cache/loomery-buildkit:/ci-cache"

  - label: ":white_check_mark: Verify"
    key: "verify"
    depends_on: "build-ci-image"
    command: "mise run verify"
    cache: &cargo-cache
      name: "rust-verify-v1"
      paths:
        - "/cache/loomery-cargo"
      size: "40g"
    plugins:
      - artifacts#v1.9.4:
          download: "loomery-ci.tar.gz"
          step: "build-ci-image"
      - docker#v5.14.0:
          image: "${LOOMERY_CI_IMAGE}"
          load: "loomery-ci.tar.gz"
          environment: &cargo-cache-environment
            - "CARGO_TARGET_DIR=/ci-target"
            # mr-boxington keeps its content-addressed store in the same volume
            # as the target directory, so restoring a compiler action is a local
            # link rather than a download. The image enables it for every mise
            # task (mise.toml's `mr_boxington` option on the Rust tool); see the
            # prebuild note in .buildkite/Dockerfile.
            - "MBX_CACHE_DIR=/mbx-cache"
            # Bound the store alone: `gc.max_size` never counts the target
            # directory, and this leaves the 40g volume room for /ci-target, the
            # registry and git.
            - "MBX_GC_MAX_SIZE=20GiB"
          volumes: &cargo-cache-volumes
            - "/cache/loomery-cargo/target:/ci-target"
            - "/cache/loomery-cargo/mbx:/mbx-cache"
            - "/cache/loomery-cargo/registry:/root/.cargo/registry"
            - "/cache/loomery-cargo/git:/root/.cargo/git"
          # The checkout is mounted into the container and root owns whatever
          # cargo writes there; hand it back to the agent user afterwards so the
          # agent can clean up.
          chown: true

  - label: ":test_tube: Test"
    key: "test"
    depends_on: "build-ci-image"
    command: "mise run test"
    cache:
      <<: *cargo-cache
      name: "rust-test-v1"
    plugins:
      - artifacts#v1.9.4:
          download: "loomery-ci.tar.gz"
          step: "build-ci-image"
      - docker#v5.14.0:
          image: "${LOOMERY_CI_IMAGE}"
          load: "loomery-ci.tar.gz"
          environment: *cargo-cache-environment
          volumes: *cargo-cache-volumes
          chown: true

  - label: ":key: Test services (Keycloak + NATS)"
    key: "test-services"
    depends_on: "build-ci-image"
    command: ".buildkite/scripts/test-services.sh"
    cache:
      <<: *cargo-cache
      name: "rust-test-services-v1"
    # The stack publishes 4222/8222/8080 on the host, so only one of these runs
    # at a time, in this build or any other.
    concurrency: 1
    concurrency_group: "loomery/test-services"
    plugins:
      - artifacts#v1.9.4:
          download: "loomery-ci.tar.gz"
          step: "build-ci-image"
      - docker#v5.14.0:
          image: "${LOOMERY_CI_IMAGE}"
          load: "loomery-ci.tar.gz"
          environment: *cargo-cache-environment
          # `docker compose` talks to the host daemon, which resolves the bind
          # mount in compose.test.yaml (./scripts/test-services/keycloak) against
          # the compose project directory. Running the command from the same
          # absolute path as the host checkout keeps that path valid on the host.
          # Expand on this job's agent, not on the pipeline-upload agent.
          workdir: "$${BUILDKITE_BUILD_CHECKOUT_PATH}"
          expand-volume-vars: true
          # Host networking puts the published service ports on 127.0.0.1 for
          # the tests, exactly where scripts/test-services/wait-for-services.sh
          # and the integration suite look for them.
          network: "host"
          chown: true
          volumes:
            - "/var/run/docker.sock:/var/run/docker.sock"
            - "/cache/loomery-cargo/target:/ci-target"
            - "/cache/loomery-cargo/mbx:/mbx-cache"
            - "/cache/loomery-cargo/registry:/root/.cargo/registry"
            - "/cache/loomery-cargo/git:/root/.cargo/git"

  - label: ":scroll: Licenses"
    key: "licenses"
    depends_on: "build-ci-image"
    command: "mise run licenses-check"
    cache:
      <<: *cargo-cache
      name: "rust-licenses-v1"
    plugins:
      - artifacts#v1.9.4:
          download: "loomery-ci.tar.gz"
          step: "build-ci-image"
      - docker#v5.14.0:
          image: "${LOOMERY_CI_IMAGE}"
          load: "loomery-ci.tar.gz"
          environment: *cargo-cache-environment
          volumes: *cargo-cache-volumes
          chown: true

  - label: ":scroll: Docs (Mermaid diagrams + links)"
    key: "docs"
    depends_on: "build-ci-image"
    command: "mise run docs-mermaid && mise run docs-links"
    plugins:
      - artifacts#v1.9.4:
          download: "loomery-ci.tar.gz"
          step: "build-ci-image"
      - docker#v5.14.0:
          image: "${LOOMERY_CI_IMAGE}"
          load: "loomery-ci.tar.gz"
          # No cargo cache: this step only parses the docs. `npm ci` installs the
          # two checker packages into the checkout (gitignored), which is why the
          # files have to be handed back to the agent user.
          chown: true

  - label: ":bar_chart: Quality (coverage + CRAP)"
    key: "quality"
    depends_on: "build-ci-image"
    command: "mise run crap"
    cache:
      <<: *cargo-cache
      name: "rust-quality-v1"
    plugins:
      - artifacts#v1.9.4:
          download: "loomery-ci.tar.gz"
          step: "build-ci-image"
      - docker#v5.14.0:
          image: "${LOOMERY_CI_IMAGE}"
          load: "loomery-ci.tar.gz"
          environment: *cargo-cache-environment
          volumes: *cargo-cache-volumes
          chown: true

  - label: ":shield: Audit"
    key: "audit"
    depends_on: "build-ci-image"
    # `--no-fetch` against the database the image carries: the fetch is what failed
    # here, and a database cloned during the image build is as fresh as the run.
    command: "mise run audit -- --no-fetch --db /opt/rustsec-advisory-db"
    cache:
      <<: *cargo-cache
      name: "rust-audit-v1"
    plugins:
      - artifacts#v1.9.4:
          download: "loomery-ci.tar.gz"
          step: "build-ci-image"
      - docker#v5.14.0:
          image: "${LOOMERY_CI_IMAGE}"
          load: "loomery-ci.tar.gz"
          environment: *cargo-cache-environment
          volumes: *cargo-cache-volumes
          chown: true
